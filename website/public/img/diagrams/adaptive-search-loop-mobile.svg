<svg xmlns="http://www.w3.org/2000/svg" width="360" height="860" viewBox="0 0 360 860" role="img" aria-labelledby="adaptive-search-mobile-title adaptive-search-mobile-desc">
  <title id="adaptive-search-mobile-title">A proposed feedback loop for adaptive search</title>
  <desc id="adaptive-search-mobile-desc">Define the question, consider eligible candidates, choose one, read its feedback, and update priorities. Feedback can guide another choice. Compare adaptive choices with a fixed ranking under the same candidate set and budget.</desc>
  <defs>
    <marker id="adaptive-search-mobile-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#557674"/></marker>
    <marker id="adaptive-search-mobile-arrow-focus" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#386f9c"/></marker>
  </defs>
  <rect width="360" height="860" fill="#f8faf5"/>
  <text x="28" y="38" fill="#456d69" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">CONCEPTUAL ADAPTIVE SEARCH LOOP</text>
  <g fill="none" stroke="#557674" stroke-width="2" marker-end="url(#adaptive-search-mobile-arrow)">
    <path d="M180 152 V178"/>
    <path d="M180 266 V292"/>
    <path d="M180 380 V406"/>
    <path d="M180 494 V520"/>
  </g>
  <path d="M316 564 H336 Q344 564 344 556 V344 Q344 336 336 336 H316" fill="none" stroke="#386f9c" stroke-width="2.5" marker-end="url(#adaptive-search-mobile-arrow-focus)"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <g>
      <rect x="44" y="64" width="272" height="88" rx="8" fill="#ffffff" stroke="#b9cbc1"/>
      <text x="60" y="88" fill="#4b625f" font-size="11" font-weight="700" letter-spacing="1.2">01 / DEFINE</text>
      <text x="60" y="116" fill="#172927" font-size="17" font-weight="650">Frame the question</text>
      <text x="60" y="137" fill="#4b625f" font-size="12">What can feedback tell us?</text>
    </g>
    <g>
      <rect x="44" y="178" width="272" height="88" rx="8" fill="#ffffff" stroke="#b9cbc1"/>
      <text x="60" y="202" fill="#4b625f" font-size="11" font-weight="700" letter-spacing="1.2">02 / SPACE</text>
      <text x="60" y="230" fill="#172927" font-size="17" font-weight="650">Eligible candidates</text>
      <text x="60" y="251" fill="#4b625f" font-size="12">Within the defined constraints</text>
    </g>
    <g>
      <rect x="44" y="292" width="272" height="88" rx="8" fill="#ffffff" stroke="#b9cbc1"/>
      <text x="60" y="316" fill="#4b625f" font-size="11" font-weight="700" letter-spacing="1.2">03 / SELECT</text>
      <text x="60" y="344" fill="#172927" font-size="17" font-weight="650">Choose a candidate</text>
      <text x="60" y="365" fill="#4b625f" font-size="12">From current priorities</text>
    </g>
    <g>
      <rect x="44" y="406" width="272" height="88" rx="8" fill="#e6f0ef" stroke="#386f9c" stroke-width="1.5"/>
      <text x="60" y="430" fill="#315f75" font-size="11" font-weight="700" letter-spacing="1.2">04 / FEEDBACK</text>
      <text x="60" y="458" fill="#172927" font-size="17" font-weight="650">Read the signal</text>
      <text x="60" y="479" fill="#315f75" font-size="12">Computational or screen feedback</text>
    </g>
    <g>
      <rect x="44" y="520" width="272" height="88" rx="8" fill="#ffffff" stroke="#b9cbc1"/>
      <text x="60" y="544" fill="#4b625f" font-size="11" font-weight="700" letter-spacing="1.2">05 / ADAPT</text>
      <text x="60" y="572" fill="#172927" font-size="17" font-weight="650">Update priorities</text>
      <text x="60" y="593" fill="#4b625f" font-size="12">Use what is now known</text>
    </g>
  </g>

  <text x="44" y="643" fill="#315f75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Feedback informs the next choice.</text>
  <rect x="28" y="674" width="304" height="150" rx="8" fill="#edf4ef" stroke="#b9cbc1"/>
  <text x="44" y="702" fill="#456d69" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">EVALUATE THE IDEA</text>
  <text x="44" y="733" fill="#172927" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">Compare with a fixed ranking</text>
  <text x="44" y="755" fill="#172927" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">under the same budget.</text>
  <text x="44" y="786" fill="#4b625f" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">A signal can guide priorities;</text>
  <text x="44" y="804" fill="#4b625f" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12">biology requires separate evidence.</text>
</svg>
